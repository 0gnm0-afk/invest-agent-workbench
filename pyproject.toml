[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "invest-agent"
version = "0.3.0"
description = "Local session-centered investment workspace"
requires-python = ">=3.12"
dependencies = [
  "mcp>=1.29,<2",
  "numpy>=2.5,<3",
  "pandas>=3,<4",
  "fastmcp-slim[client]>=3,<4",
  "finance-datareader>=0.9.100",
  "opendartreader==0.2.2",
  "requests>=2.31,<3",
  "exchange-calendars>=4.13.2,<5",
  "matplotlib>=3.11,<4",
  "markdown-it-py>=4,<5",
]

[project.scripts]
invest-agent = "invest_agent.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
invest_agent = ["LICENSE"]
